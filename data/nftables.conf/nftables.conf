#!/usr/sbin/nft -f

flush ruleset

# WAN host: policy drop. Only loopback, established/related, ICMP, SSH and the
# model gateway (to the rig IPs) are open to the WAN. The model daemon stays
# loopback (127.0.0.1:11434).
table inet filter {
  chain INPUT {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state { established, related } accept
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    tcp dport __MDCI_SSH_PORT__ accept comment "SSH"
    tcp dport __MDCI_GATEWAY_PORT__ ip saddr { __MDCI_RIG_IP__ } accept comment "model API gateway (rig IPs only)"
  }

  chain FORWARD {
    type filter hook forward priority filter; policy drop;
  }

  chain OUTPUT {
    type filter hook output priority filter; policy accept;
  }
}
