# MDCI model API gateway — TLS reverse proxy in front of Ollama (127.0.0.1:11434).
# Two gates: a bearer token checked per request, and an nftables IP ACL (the
# firewall opens this port only to MDCI_RIG_IP). Ollama itself stays loopback-only.

map $http_authorization $mdci_auth_ok {
    default 0;
    "Bearer __MDCI_API_KEY__" 1;
}

server {
    listen __MDCI_GATEWAY_PORT__ ssl http2;
    server_name __MDCI_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__MDCI_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MDCI_HOST__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MCPTLS:10m;
    ssl_session_tickets off;

    # the token is required before any byte is proxied
    location /v1/ {
        if ($mdci_auth_ok != 1) { return 401 '{"error":"unauthorized"}\n'; }

        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 16m;
    }

    # nothing else is proxied
    location / {
        return 404;
    }
}
